            +package tui
            +
            +import (
            +	"charm.land/bubbletea/v2"
            +
            +	"github.com/ceffo/mrboard/internal/domain"
            +)
            +
            +// batchPreview lists the per-MR reviewer changes staged by the batch
            +// editor and lets the operator include or exclude each row before the
            +// writes are issued. Rows whose before/after sets match are excluded
            +// and cannot be toggled on — writing them would be a no-op round trip.
            +type batchPreview struct {
            +	rows   []previewRow
            +	cursor int
            +	width  int
            +	height int
            +}
            +
            +type previewRow struct {
            +	mr       domain.MergeRequest
            +	before   []string
            +	after    []string
            +	included bool
            +}
        - old_path: internal/tui/model.go
          new_path: internal/tui/model.go
          added: 42
