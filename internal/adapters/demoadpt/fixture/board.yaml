    description: |-
      ## What

      Adds an editor for a project's approval rule so reviewers can be promoted
      to approvers without leaving the board.

      ## Why

      Today this is a four-click trip through the web UI, and it is the single
      most common thing we do during standup.

      - reads the existing rule, so it is safe to open on any MR
      - writes only when the set actually changed
      - falls back to a plain reviewer list when the rule is unsupported

      ```go
      func (e Editor) Staged() []domain.ProjectMember {
          return slices.Clone(e.staged)
      }
      ```

      ---
