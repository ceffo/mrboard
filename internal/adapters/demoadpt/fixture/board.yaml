# Demo dataset for `mrboard --demo`. Everything here is invented.
#
# TWO RULES WHEN EDITING:
#
# 1. Every `*_ago` offset must be a WHOLE NUMBER OF MINUTES. Card ages are
#    rendered truncated to the minute, so an offset with a seconds component
#    makes the first frame of a recording differ from the next. Syntax is
#    `<n>d<n>h<n>m`, any part optional — deliberately the same vocabulary the
#    board prints, so you write the age you want to see. Enforced by a test.
#
# 2. Every MR whose title carries a ticket key in parentheses must have a
#    description ending in the `<!-- mrboard -->` marker. Without it the board
#    treats the back-link as missing and issues a description write on every
#    fetch, mutating the demo while it is on screen. Enforced by a test.
#
# `phase` is deliberately absent: it is derived by domain.ClassifyPhase from
# draft + reviewer states, so this fixture can never disagree with the real
# rules. Column placement is asserted in demoadpt_test.go.
schema: 1

# How old the pre-seeded cache claims to be, so the board opens warm (an
# interactive board on frame 1) instead of on a spinner.
