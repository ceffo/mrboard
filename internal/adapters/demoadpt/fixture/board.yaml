             	board       Board
             	detail      DetailPane
            -	reviewers   ReviewerEditor
            +	reviewers   ReviewerEditor
            +	batch       BatchEditor
            +	preview     batchPreview
             	footer      Footer

            @@ -742,6 +747,18 @@ func (m Model) coreUpdate(msg tea.Msg) (tea.Model, tea.Cmd) {
            +	case BatchPreviewMsg:
            +		m.preview = newBatchPreview(msg.Rows)
            +		m.state = statePreview
            +		return m, nil
            +
