# FIXTURE `refresh-failure`: the `load` scenario with injected failures, to watch
# the board and the load view ride out a failed refresh (#87).
# Run it with `scripts/demo-tui.sh refresh-failure`.
#
# Calls are counted from boot: fetch 1 is the boot fetch, fetch 2 the one opening
# the load view (L) starts, and every refresh (r) adds a fetch and a sprint read.
# The first refresh after opening the load view fails both: its fetch lists
# nothing and reports an error, its sprint read finds no active sprint. The
# second refresh succeeds.
#
# The data is a copy of `load.yaml`.
#
# SAME RULES AS EVERY FIXTURE: every `*_ago` is a whole number of minutes, and
# every MR whose title carries a ticket key ends its description with the
# `<!-- mrboard -->` marker.
