# FIXTURE `reviewers`: scenarios for the reviewer editor, the batch preview and
# the writes behind them. Run it with `scripts/demo-tui.sh reviewers`.
#
# This is a test dataset, not a showcase. It is deliberately NOT the recording's
# dataset (that is `gif`), and automatic reviewer assignment is OFF here: with it
# on, the board would rewrite reviewers on its own while you are editing them.
# Scenarios that need it on live in their own fixture.
#
# Scenarios, by ticket key:
#
#   REV-100  eleven related MRs (more than a screenful, so both lists scroll),
#            each in a different state relative to !501 (platform-api), the one to
#            open the editor on. Its reviewers are grace (approver) and linus.
#              !502  identical to !501                     — applying changes nothing
#              !503  no reviewers                          — applying adds everyone
#              !504  adds margaret                         — a union must keep her
#              !505  grace as a plain reviewer             — only the approver flag is added
#              !506  katherine as the sole approver        — a union must keep her approver flag
#              !507  draft, no reviewers
#              !508  grace has approved, linus commented   — states must survive a write
#              !509  margaret (approver) wants re-review, edsger
#              !510  barbara only
#              !511  linus approver, grace plain           — approvers swapped
#   REV-300  two MRs with very long titles, one in a very long repository path —
#            nothing may resize as the cursor moves over them
#   REV-400  one MR with no related MRs                   — the editor saves directly
#   (none)   one MR with no ticket key and no reviewers
#
# SAME RULES AS EVERY FIXTURE: every `*_ago` is a whole number of minutes
# (`<n>d<n>h<n>m`, any part optional), and every MR whose title carries a ticket
# key ends its description with the `<!-- mrboard -->` marker. Both are enforced
# by a test over all fixtures.
