# FIXTURE `auto-assign`: automatic reviewer assignment is ON. Run it with
# `scripts/demo-tui.sh auto-assign`.
#
# The board assigns the team on its own as soon as it lands the first fetch, so
# this dataset is only good for watching that happen. It is kept apart from
# `reviewers` because the two setups contradict each other: with the feature on,
# every MR below that qualifies is rewritten before you can interact with it.
#
# An MR qualifies when its author is on the team, its title carries a ticket key,
# it has no reviewers yet, and it is not a draft:
#
#   !601  qualifies                                — gets the team minus its author
#   !602  already has a reviewer                   — left alone
#   !603  draft                                    — left alone until it is undrafted
#   !604  author is not on the team (ops-bot)      — left alone
#   !605  no ticket key                            — left alone
#
# SAME RULES AS EVERY FIXTURE: every `*_ago` is a whole number of minutes, and
# every MR whose title carries a ticket key ends its description with the
# `<!-- mrboard -->` marker. Both are enforced by a test over all fixtures.
schema: 1

settings:
  current_user: ada
  team: [ada, grace, linus, margaret, katherine]
  auto_assign_reviewers: true

snapshot_written_ago: 14m

