version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: mrboard
    main: ./cmd/mrboard
    binary: mrboard
    ldflags:
      - -s -w -X github.com/ceffo/mrboard/internal/cmd/mrboard.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: mrboard
    name_template: "mrboard_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

brews:
  - name: mrboard
    directory: Formula
    repository:
      owner: ceffo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/ceffo/mrboard"
    description: "GitLab MR review board for daily standups"
    install: |
      bin.install "mrboard"
      # shell_parameter_format: :cobra already appends `completion <shell>` to the
      # invocation. Do not pass "completion" as an explicit command arg here — that
      # duplicates it, invoking `mrboard completion completion <shell>` and printing
      # cobra's help text instead of a real completion script (regressed twice: #1).
      generate_completions_from_executable(bin/"mrboard",
                                            shell_parameter_format: :cobra,
                                            shells: [:bash, :zsh, :fish])
    test: |
      system "#{bin}/mrboard", "--version"
