name: Release

# The one place that knows how to publish a release. Reached three ways: a tag
# pushed by scripts/release.sh, a dispatch from release-on-merge.yml, and a
# manual dispatch. Every path releases an existing tag; none creates one.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.10.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # On a tag push `inputs` is empty, so this falls back to github.ref.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          # Newest goreleaser within v2. `latest` would follow a future v3 into
          # whatever it changes about publishing, unannounced and mid-release.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
