name: Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Only the newest run on a ref is the answer.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # the toolchain go.mod asks for, not a second copy of it
          cache: true

      # golangci-lint needs no install step: it is a go.mod tool, so `just lint`
      # builds the exact version this checkout records.
      - name: Install just
        env:
          JUST_VERSION: "1.58.0"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # From the GitHub release, not just.systems/install.sh — that returns
          # 403 to Actions runners.
          curl -sSfL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" |
            tar -xz -C "$HOME/.local/bin" just

      - name: Report tool versions
        run: |
          just --version
          go tool golangci-lint --version

      # The same gate as a local `just check`, except formatting is verified
      # rather than applied — CI must fail on unformatted code, not fix it in a
      # checkout nobody keeps.
      - run: just check-ci
